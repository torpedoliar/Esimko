version: '3.8'

services:
  # Nginx Proxy Manager - handles SSL and reverse proxy
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: esimko-npm
    restart: unless-stopped
    ports:
      - '80:80' # HTTP
      - '443:443' # HTTPS
      - '81:81' # NPM Admin UI
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - esimko-network
    healthcheck:
      test: [ "CMD", "/bin/check-health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: esimko-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - esimko-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: esimko-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: esimko
      MYSQL_USER: esimko
      MYSQL_PASSWORD: esimko_password_123
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - esimko-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_123" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Esimko Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esimko-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_NAME=eSIMKO
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=https://esimko.com

      # Database
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=esimko
      - DB_USERNAME=esimko
      - DB_PASSWORD=esimko_password_123

      # Cache & Session
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=null

      # Trusted Proxies for NPM
      - TRUSTED_PROXIES=*
    volumes:
      # Mount project files
      - .:/var/www/html
      # Persist storage
      - app_storage:/var/www/html/storage/app
      - app_framework:/var/www/html/storage/framework
    networks:
      - esimko-network
    # Direct access on port 8080 (bypass NPM)
    ports:
      - "8080:80"
    # Also expose for NPM proxy
    expose:
      - "80"

networks:
  esimko-network:
    driver: bridge

volumes:
  npm_data:
  npm_letsencrypt:
  mysql_data:
  redis_data:
  app_storage:
  app_framework:
