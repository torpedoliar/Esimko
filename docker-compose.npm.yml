version: '3.8'

services:
  # Nginx Proxy Manager - handles SSL and reverse proxy
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    ports:
      - '80:80'      # HTTP
      - '443:443'    # HTTPS
      - '81:81'      # NPM Admin UI
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - esimko-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: esimko-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: esimko
      MYSQL_USER: esimko
      MYSQL_PASSWORD: esimko_password_123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./esimko_prod_backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
    networks:
      - esimko-network
    command: --default-authentication-plugin=mysql_native_password

  # Esimko Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.npm
    container_name: esimko-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:YOUR_APP_KEY_HERE
      - APP_URL=https://esimko.com
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=esimko
      - DB_USERNAME=esimko
      - DB_PASSWORD=esimko_password_123
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    networks:
      - esimko-network

networks:
  esimko-network:
    driver: bridge

volumes:
  npm_data:
  npm_letsencrypt:
  mysql_data:
  app_storage:
  app_cache:
