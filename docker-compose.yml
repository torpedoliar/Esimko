version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: esimko-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esimko-app
    ports:
      - "8080:80"
      - "8443:443"
      - "2222:22"
    volumes:
      # Mount project files ke /var/www/html untuk match Laravel config
      - .:/var/www/html
      # Persist MySQL data
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=MYSQLp4ssw0rd7%
      - APP_ENV=local
      - APP_DEBUG=true
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=file
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
